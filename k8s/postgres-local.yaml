---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: jenkins-argocd
data:
  POSTGRES_DB: flights
  POSTGRES_USER: user

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: jenkins-argocd
type: Opaque
stringData:
  POSTGRES_PASSWORD: password  # Change before any real environment

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: jenkins-argocd
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  clusterIP: None  # Headless service — DNS resolves directly to pod IP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: jenkins-argocd
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: postgres-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "user", "-d", "flights"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "user", "-d", "flights"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
