# Explicit rule set, so CI does not change behaviour when ruff changes its defaults.
# This is the classic default: pycodestyle errors (E4, E7, E9) and pyflakes (F).
# Style-only rules (import sorting, pyupgrade, bugbear) are out of scope for now:
# enabling them is a separate, reviewable change to the code.
[lint]
select = ["E4", "E7", "E9", "F"]
