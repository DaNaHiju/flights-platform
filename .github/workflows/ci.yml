name: CI

# PR: lint + test + build + scan (nothing is pushed).
# main: the same, then push the image to GHCR and bump the tag in the manifests repo.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # ── Which services does this change touch? ─────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    # Overrides the workflow-level permissions for this job only:
    # paths-filter reads the PR's file list through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # JSON list of services to build, e.g. ["api","worker","web"] or [].
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            worker:
              - 'services/worker/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            web:
              - 'services/web/**'
              - '.github/workflows/ci.yml'
      - name: List services to build
        id: list
        env:
          API: ${{ steps.filter.outputs.api }}
          WORKER: ${{ steps.filter.outputs.worker }}
          WEB: ${{ steps.filter.outputs.web }}
        run: |
          services=$(jq -nc --arg api "$API" --arg worker "$WORKER" --arg web "$WEB" \
            '[ (if $api == "true" then "api" else empty end),
               (if $worker == "true" then "worker" else empty end),
               (if $web == "true" then "web" else empty end) ]')
          echo "services=$services" >> "$GITHUB_OUTPUT"

  # ── One matrix leg per changed service ─────────────────────────────────────
  build:
    needs: changes
    # An empty matrix is an error in Actions, so skip the whole job instead.
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      # Let the other service finish: its result is still useful on a PR.
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    env:
      IMAGE: ghcr.io/danahiju/flights-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      # api and worker: Python lint + tests. web has its own steps below.
      - uses: actions/setup-python@v7
        if: matrix.service != 'web'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/${{ matrix.service }}/requirements.txt
            services/${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        if: matrix.service != 'web'
        run: pip install -r services/${{ matrix.service }}/requirements-dev.txt ruff==0.17.2

      - name: Lint
        if: matrix.service != 'web'
        run: ruff check services/${{ matrix.service }} shared

      # One pytest run per service: both have a top-level `tests` package,
      # so their conftest files clash in the same session.
      - name: Test
        if: matrix.service != 'web'
        run: pytest -q services/${{ matrix.service }}

      # web: Node lint + tests (the image build itself runs `npm run build`).
      - uses: actions/setup-node@v7
        if: matrix.service == 'web'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/web/package-lock.json

      - name: Install dependencies (web)
        if: matrix.service == 'web'
        working-directory: services/web
        run: npm ci

      - name: Lint (web)
        if: matrix.service == 'web'
        working-directory: services/web
        run: npm run lint

      - name: Test (web)
        if: matrix.service == 'web'
        working-directory: services/web
        run: npm test

      - name: Compute image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # Build context is the repo root: the Dockerfile copies shared/.
      # The action wraps `docker buildx build --load` and also hands the runner's
      # cache credentials to the gha cache backend, which a plain `run:` step lacks.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Pinned to a commit (v0.36.0): it is a third-party action that downloads
      # and runs a scanner, so a moved tag should not be able to change what runs.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          # Only fail on vulnerabilities that have a fix available.
          ignore-unfixed: true

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: docker push "$IMAGE:${{ steps.tag.outputs.tag }}"

  # ── Point staging at the new images ────────────────────────────────────────
  update-manifests:
    needs: [changes, build]
    # The build job result is "success" only if every matrix leg passed.
    # It is "skipped" when nothing was built, and then there is nothing to bump.
    if: github.event_name == 'push' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    # The write to the manifests repo uses the GitHub App token, not GITHUB_TOKEN.
    permissions:
      contents: read
    # One bump at a time, queued rather than cancelled.
    concurrency:
      group: update-manifests
      cancel-in-progress: false
    steps:
      - name: Create GitHub App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MANIFESTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.MANIFESTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: flights-platform-manifests

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/flights-platform-manifests
          ref: main
          token: ${{ steps.app.outputs.token }}

      # Commits are authored by the App's bot user, so they show up as
      # "<app-slug>[bot]" in the manifests history.
      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          bot_id=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${bot_id}+${SLUG}[bot]@users.noreply.github.com"

      # Only the services built in this run are touched. The tag key is separate
      # per service: api in the staging values file, worker and web in the chart values.
      - name: Bump image tags
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA::7}"
          export TAG
          for svc in $(jq -r '.[]' <<< "$SERVICES"); do
            case "$svc" in
              api)    file=charts/flights-api/values-staging.yaml ;;
              worker) file=charts/flights-worker/values.yaml ;;
              web)    file=charts/flights-web/values.yaml ;;
              *)      echo "::error::unknown service $svc"; exit 1 ;;
            esac
            # sed edits only the `tag:` line inside the top-level `image:` block.
            # `yq -i` would rewrite the file and drop its blank lines, which would
            # bury the one-line change in every bot commit.
            sed -i -E "/^image:/,/^[^ ]/ s/^(  tag: ).*/\1\"$TAG\"/" "$file"
            # yq only reads here: parse the YAML and fail unless sed hit the right key.
            if [ "$(yq '.image.tag' "$file")" != "$TAG" ]; then
              echo "::error::$file: image.tag is not $TAG after the edit"
              exit 1
            fi
            git add "$file"
            # Re-running a job for the same commit changes nothing.
            if git diff --cached --quiet; then
              echo "flights-$svc already at $TAG"
              continue
            fi
            git commit -m "chore(staging): bump flights-$svc to $TAG"
          done

      # Another writer can move main between checkout and push. Rebase and retry.
      - name: Push to main
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "push rejected (attempt $attempt of 3), rebasing"
              git pull --rebase origin main
            fi
          done
          echo "::error::could not push to flights-platform-manifests after 3 attempts"
          exit 1

  # ── Single required check for the branch ruleset ───────────────────────────
  # build is a matrix that is skipped when nothing changed, so it cannot be
  # marked required itself. This job always runs and summarises it.
  ci-ok:
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a required job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
