version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flights
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d flights"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/flights
      REDIS_URL: redis://redis:6379/0
      FLIGHTS_CURRENCY: USD
      FLIGHTS_DEFAULT_ORIGIN: TLV
      LOG_LEVEL: INFO
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # One-shot job: refreshes deals:top once and exits. In Kubernetes a CronJob
  # (manifests repo) runs it on a schedule. No DATABASE_URL on purpose.
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      FLIGHTS_CURRENCY: USD
      FLIGHTS_DEFAULT_ORIGIN: TLV
      LOG_LEVEL: INFO
      ENVIRONMENT: development
    depends_on:
      redis:
        condition: service_healthy
    # "no": a restart loop would hammer Google Flights through fli.
    restart: "no"

volumes:
  postgres_data:
