# Replaces /etc/nginx/conf.d/default.conf of nginx-unprivileged.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Compress what the browser downloads most: a flight search answers with
    # about 1.6 MB of JSON, and the app's JS and CSS are text too. (text/html is
    # always compressed once gzip is on; images are already compressed.)
    # Both JavaScript types are listed because nginx's mime.types changed which
    # one it sends for .js. gzip_min_length skips tiny answers, where the gzip
    # header costs more than it saves. gzip_proxied any: also compress when a
    # proxy in front of nginx adds a Via header (nginx's default is not to).
    gzip on;
    gzip_types application/json application/javascript text/javascript text/css;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;

    # The browser only talks to this origin. A trailing "/" on proxy_pass makes
    # nginx replace the matched "/api/" prefix, so /api/flights -> /flights.
    # The name is resolved once, when nginx starts.
    location /api/ {
        proxy_pass http://flights-api-staging.staging.svc.cluster.local:8000/;
        # A live provider search can take a while.
        proxy_read_timeout 60s;
    }

    # Single-page app: unknown paths get index.html so client routes survive a reload.
    location / {
        try_files $uri /index.html;
    }
}
