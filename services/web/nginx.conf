# Replaces /etc/nginx/conf.d/default.conf of nginx-unprivileged.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # The browser only talks to this origin. A trailing "/" on proxy_pass makes
    # nginx replace the matched "/api/" prefix, so /api/flights -> /flights.
    # The name is resolved once, when nginx starts.
    location /api/ {
        proxy_pass http://flights-api-staging.staging.svc.cluster.local:8000/;
        # A live provider search can take a while.
        proxy_read_timeout 60s;
    }

    # Single-page app: unknown paths get index.html so client routes survive a reload.
    location / {
        try_files $uri /index.html;
    }
}
